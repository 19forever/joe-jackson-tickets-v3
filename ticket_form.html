<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contribute Memorabilia - Joe Jackson Archive</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    .form-container {
      width: 100%;
      max-width: 600px;
      background-color: var(--bg-panel, #161e2e);
      border: 1px solid var(--border-color, #2a364f);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      color: var(--text-main, #e2e8f0);
    }

    .form-intro {
      margin-bottom: 20px;
      line-height: 1.6;
      color: var(--text-muted, #9ca3af);
      font-size: 0.92rem;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main, #e2e8f0);
    }
    label span { color: var(--accent-orange, #ef4444); }

    input[type="text"], input[type="date"], input[type="email"], textarea {
      background-color: var(--bg-card, #0f172a);
      border: 1px solid var(--border-color, #2a364f);
      color: var(--text-main, #fff);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus { border-color: var(--accent-blue, #3b82f6); }

    input[type="file"] {
      background-color: var(--bg-card, #0f172a);
      border: 1px dashed var(--accent-blue, #3b82f6);
      color: var(--text-muted, #9ca3af);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .form-checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-top: 4px;
    }
    .form-checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-yellow, #f59e0b);
      cursor: pointer;
    }

    .btn-submit {
      background-color: var(--accent-yellow, #f59e0b);
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-submit:hover { background-color: #fde047; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: wait; transform: none; }

    #statusMessage {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      text-align: center;
      line-height: 1.5;
    }
    #statusMessage.success {
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid #4ade80;
      color: #4ade80;
    }
    #statusMessage.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    @media (max-width: 600px) {
      body { padding: 15px; }
    }
  </style>
</head>
<body>

  <header style="max-width: 600px; width: 100%; margin-bottom: 20px;">
    <div class="header-left">
      <a href="index.html" style="text-decoration: none;"><div class="logo">JJ</div></a>
      <div class="title-area">
        <h1>Contribute Memorabilia</h1>
        <p>Share your Joe Jackson concert ticket, pass or poster</p>
      </div>
    </div>
    <a href="index.html" class="btn-contribute">◄ Back to Museum</a>
  </header>

  <div class="form-container">
    <p class="form-intro">
      Help us preserve Joe Jackson's live concert history! Please submit your scan or photo below.
    </p>

    <!-- Odesílání přes Formsubmit.co -->
    <form id="contribForm" action="https://formsubmit.co/marekkraus@gmail.com" method="POST" enctype="multipart/form-data">
      <input type="hidden" name="_subject" value="JJMM - Memorabilia Addition">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      
      <!-- Skryté pole, které předá finální jméno dárce (Jméno nebo '?') -->
      <input type="hidden" id="finalContributor" name="Donor Credit (For Museum Card)" value="">

      <!-- 1. Concert Date -->
      <div class="form-group">
        <label for="date">Concert Date <span>*</span></label>
        <input type="date" id="date" name="Concert Date" required>
      </div>

      <!-- 2. City, Country -->
      <div class="form-group">
        <label for="city_country">City, Country <span>*</span></label>
        <input type="text" id="city_country" name="City and Country" placeholder="e.g. London, UK or Prague, Czech Republic" required>
      </div>

      <!-- 3. Venue -->
      <div class="form-group">
        <label for="venue">Venue</label>
        <input type="text" id="venue" name="Venue" placeholder="e.g. Royal Albert Hall, Lucerna Music Bar">
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border-color, #2a364f); margin: 20px 0;">

      <!-- 4. Contributor Name & Checkbox -->
      <div class="form-group">
        <label for="contributor">Your Name / Credit <span>*</span></label>
        <input type="text" id="contributor" name="Contributor Real Name" placeholder="e.g. John Doe or JJ_Fan_99" required>
      </div>

      <div class="form-group">
        <label class="form-checkbox-group">
          <input type="checkbox" id="publishConsent" checked>
          <span style="font-size: 0.88rem; font-weight: normal; color: var(--text-main, #e2e8f0);">
            My name / nick can be published as a donor on the museum card
          </span>
        </label>
      </div>

      <!-- 5. Email -->
      <div class="form-group">
        <label for="email">Your Email <span>*</span></label>
        <input type="email" id="email" name="email" placeholder="your.email@example.com (private, for questions only)" required>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--border-color, #2a364f); margin: 20px 0;">

      <!-- 6. Image Upload -->
      <div class="form-group">
        <label for="scan_file">Upload Image Scan / Photo <span>*</span></label>
        <input type="file" id="scan_file" name="Attachment" accept="image/*" required>
      </div>

      <!-- 7. Notes -->
      <div class="form-group">
        <label for="notes">Additional Information / Notes</label>
        <textarea id="notes" name="Notes" rows="3" placeholder="Concert memories, supporting act details, tour anecdotes..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">🚀 Submit Memorabilia to Archive</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    let selectedFileBlob = null;

    // Předvyplnění z URL parametrů
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      
      if (params.has('date')) {
        document.getElementById('date').value = params.get('date');
      }

      const city = params.get('city') || '';
      const country = params.get('country') || '';
      if (city || country) {
        document.getElementById('city_country').value = [city, country].filter(Boolean).join(', ');
      }

      if (params.has('venue')) {
        document.getElementById('venue').value = params.get('venue');
      }

      if (params.has('notes')) {
        document.getElementById('notes').value = params.get('notes');
      }
    });

    // Uložení vybraného souboru
    document.getElementById('scan_file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        selectedFileBlob = file;
      }
    });

    // Odeslání přes Formsubmit.co
    document.getElementById('contribForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const form = this;
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');

      // Vyřešení souhlasu pro jméno dárce
      const consent = document.getElementById('publishConsent').checked;
      const rawName = document.getElementById('contributor').value.trim();
      document.getElementById('finalContributor').value = consent ? rawName : '?';

      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Sending memorabilia...';
      statusMsg.style.display = 'none';

      try {
        const formData = new FormData(form);

        if (selectedFileBlob) {
          formData.set('Attachment', selectedFileBlob, selectedFileBlob.name);
        }

        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          statusMsg.className = 'success';
          statusMsg.style.display = 'block';
          statusMsg.innerHTML = '🎉 <strong>Thank you!</strong> Your memorabilia contribution has been sent successfully. We will review it shortly.';
          form.reset();
          selectedFileBlob = null;
        } else {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (err) {
        statusMsg.className = 'error';
        statusMsg.style.display = 'block';
        statusMsg.innerHTML = '❌ <strong>Submission Error:</strong> Could not send form. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 Submit Memorabilia to Archive';
      }
    });
  </script>
</body>
</html>
