<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tours & Lineups Admin - JJ Museum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="storage-service.js"></script>
  <script src="auth.js"></script>
  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-panel: #141414;
      --accent-yellow: #f59e0b;
      --text-main: #e0e0e0;
      --border-color: #2a2a2a;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg-main); color: var(--text-main); padding: 20px; max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { background-color: var(--accent-yellow); color: #000; width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem; }
    h1 { font-size: 1.3rem; color: #fff; margin: 0; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .btn:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }
    .btn-green { background: #16a34a; border: none; font-weight: bold; }
    .btn-green:hover { background: #15803d; color: #fff; }
    .btn-danger { background: #ef4444; border: none; font-weight: bold; }
    .btn-danger:hover { background: #dc2626; color: #fff; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .tab-btn { background: #141414; border: 1px solid var(--border-color); color: #888; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .tab-btn.active { background: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

    .card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    input, textarea { background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 0.85rem; outline: none; font-family: inherit; }
    input:focus, textarea:focus { border-color: var(--accent-yellow); }
    textarea { resize: vertical; min-height: 65px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; vertical-align: top; }
    th { color: var(--accent-yellow); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .badge { background: #222; border: 1px solid #333; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; color: #aaa; white-space: nowrap; }
    .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
  </style>
</head>
<body>

  <!-- AUTH GATE MODAL -->
  <div id="gateModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; padding: 30px; width: 100%; max-width: 380px;">
      <div style="text-align: center; font-size: 2rem; margin-bottom: 10px;">🔒</div>
      <h2 style="text-align: center; color: #fff; margin-bottom: 6px; font-size: 1.25rem;">Admin Sign In</h2>
      <p style="text-align: center; color: #9ca3af; font-size: 0.8rem; margin-bottom: 20px;">Enter your credentials to manage Tours & Lineups.</p>

      <form onsubmit="event.preventDefault(); handleSupabaseLogin();">
        <div style="margin-bottom: 12px;">
          <input type="email" id="loginEmail" placeholder="name@example.com" required>
        </div>
        <div style="margin-bottom: 18px;">
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <div id="loginError" style="display: none; color: #f87171; font-size: 0.75rem; margin-bottom: 12px; text-align: center;"></div>
        <button type="submit" class="btn btn-green" style="width: 100%; padding: 10px;">🔓 Sign In</button>
      </form>
    </div>
  </div>

  <header>
    <div class="header-left">
      <div class="logo">JJ</div>
      <h1>🎤 Tours & Lineups Manager</h1>
    </div>
    <div class="header-actions">
      <a href="edit_ticket_new.html" id="backToEditorBtn" class="btn">◄ Back to Editor</a>
      <a href="admin_categories.html" id="backToCatBtn" class="btn">🏷️ Categories</a>
      <button class="btn btn-danger" onclick="lockAdminSession()">🔒 Lock Admin</button>
      <a href="index.html" id="backToMuseumBtn" class="btn" style="border-color: var(--accent-yellow); color: var(--accent-yellow);">Museum 🏠</a>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabToursBtn" onclick="switchTab('tours')">🎸 Tours Management</button>
    <button class="tab-btn" id="tabLineupsBtn" onclick="switchTab('lineups')">👥 Lineups Management</button>
  </div>

  <!-- TOURS TAB -->
  <div id="toursTab" class="card">
    <h3 style="color: var(--accent-yellow); margin-bottom: 10px; font-size: 0.95rem; text-transform: uppercase;">Existing Tour Names in Database</h3>
    <div id="toursContent">⏳ Loading tours...</div>
  </div>

  <!-- LINEUPS TAB -->
  <div id="lineupsTab" class="card" style="display: none;">
    <h3 style="color: var(--accent-yellow); margin-bottom: 10px; font-size: 0.95rem; text-transform: uppercase;">Existing Lineups in Database</h3>
    <div id="lineupsContent">⏳ Loading lineups...</div>
  </div>

  <script>
    let rawTicketsData = [];
    let toursGrouped = [];
    let lineupsGrouped = [];
    let editingTourIdx = -1;
    let editingLineupIdx = -1;

    async function checkAuthSession() {
      const modal = document.getElementById('gateModal');
      if (typeof supabaseClient === 'undefined' || !supabaseClient.auth) {
        if (modal) modal.style.display = 'flex';
        return false;
      }
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        if (modal) modal.style.display = 'none';
        localStorage.setItem('jj_admin_mode', 'true');
        return true;
      } else {
        if (modal) modal.style.display = 'flex';
        localStorage.removeItem('jj_admin_mode');
        return false;
      }
    }

    async function handleSupabaseLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginError');
      if (errEl) errEl.style.display = 'none';

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        if (errEl) {
          errEl.textContent = '❌ Invalid credentials: ' + error.message;
          errEl.style.display = 'block';
        }
      } else {
        localStorage.setItem('jj_admin_mode', 'true');
        await checkAuthSession();
        await loadDatabaseData();
      }
    }

    async function lockAdminSession() {
      if (typeof supabaseClient !== 'undefined' && supabaseClient.auth) {
        await supabaseClient.auth.signOut();
      }
      localStorage.removeItem('jj_admin_mode');
      window.location.href = 'index.html';
    }

    function switchTab(tab) {
      document.getElementById('tabToursBtn').classList.toggle('active', tab === 'tours');
      document.getElementById('tabLineupsBtn').classList.toggle('active', tab === 'lineups');
      document.getElementById('toursTab').style.display = tab === 'tours' ? 'block' : 'none';
      document.getElementById('lineupsTab').style.display = tab === 'lineups' ? 'block' : 'none';
    }

    async function loadDatabaseData() {
      try {
        const { data, error } = await supabaseClient
          .from('tickets')
          .select('ID_MEMORABILIA, TOUR_NAME, TOUR_ID, LINEUP');

        if (error) throw error;
        rawTicketsData = data || [];

        processToursData();
        processLineupsData();

        renderToursTable();
        renderLineupsTable();
      } catch (err) {
        console.error("Error loading data:", err);
        document.getElementById('toursContent').innerHTML = `<div style="color:#ef4444;">❌ Error: ${err.message}</div>`;
      }
    }

    function processToursData() {
      const map = new Map();
      rawTicketsData.forEach(r => {
        const name = (r.TOUR_NAME || '').trim();
        if (!name) return;
        const tourId = (r.TOUR_ID || '').trim();

        if (!map.has(name)) {
          map.set(name, { name, tourId, count: 0 });
        }
        const item = map.get(name);
        item.count += 1;
        if (!item.tourId && tourId) item.tourId = tourId;
      });

      toursGrouped = Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
    }

    function processLineupsData() {
      const map = new Map();
      rawTicketsData.forEach(r => {
        const lineup = (r.LINEUP || '').trim();
        if (!lineup) return;

        if (!map.has(lineup)) {
          map.set(lineup, { lineup, count: 0 });
        }
        map.get(lineup).count += 1;
      });

      lineupsGrouped = Array.from(map.values()).sort((a, b) => a.lineup.localeCompare(b.lineup));
    }

    function renderToursTable() {
      const container = document.getElementById('toursContent');
      if (toursGrouped.length === 0) {
        container.innerHTML = '<div style="color: #888;">No tours found in records.</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th style="width: 40%;">Tour Name</th>
              <th style="width: 30%;">Tour ID</th>
              <th style="width: 10%;">Records</th>
              <th style="text-align: right; width: 20%;">Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      toursGrouped.forEach((item, idx) => {
        if (editingTourIdx === idx) {
          // INLINE EDITING REŽIM PRO TOUR
          html += `
            <tr style="background: rgba(245, 158, 11, 0.05);">
              <td>
                <input type="text" id="edit_tour_name_${idx}" value="${escapeHtml(item.name)}">
              </td>
              <td>
                <input type="text" id="edit_tour_id_${idx}" value="${escapeHtml(item.tourId)}">
              </td>
              <td><span class="badge">${item.count} items</span></td>
              <td>
                <div class="edit-actions">
                  <button class="btn btn-green" onclick="saveTourEdit(${idx})">💾 Save</button>
                  <button class="btn" onclick="cancelTourEdit()">❌ Cancel</button>
                </div>
              </td>
            </tr>
          `;
        } else {
          // BĚŽNÝ REŽIM
          html += `
            <tr>
              <td><strong>${escapeHtml(item.name)}</strong></td>
              <td><code>${escapeHtml(item.tourId || '-')}</code></td>
              <td><span class="badge">${item.count} items</span></td>
              <td>
                <div class="edit-actions">
                  <button class="btn" onclick="enableTourEdit(${idx})">✏️ Edit</button>
                </div>
              </td>
            </tr>
          `;
        }
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderLineupsTable() {
      const container = document.getElementById('lineupsContent');
      if (lineupsGrouped.length === 0) {
        container.innerHTML = '<div style="color: #888;">No lineups found in records.</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th style="width: 70%;">Lineup Description</th>
              <th style="width: 10%;">Records</th>
              <th style="text-align: right; width: 20%;">Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      lineupsGrouped.forEach((item, idx) => {
        if (editingLineupIdx === idx) {
          // INLINE EDITING REŽIM PRO LINEUP (Textarea pro pohodlnou editaci)
          html += `
            <tr style="background: rgba(245, 158, 11, 0.05);">
              <td>
                <textarea id="edit_lineup_${idx}">${escapeHtml(item.lineup)}</textarea>
              </td>
              <td><span class="badge">${item.count} items</span></td>
              <td>
                <div class="edit-actions">
                  <button class="btn btn-green" onclick="saveLineupEdit(${idx})">💾 Save</button>
                  <button class="btn" onclick="cancelLineupEdit()">❌ Cancel</button>
                </div>
              </td>
            </tr>
          `;
        } else {
          // BĚŽNÝ REŽIM
          html += `
            <tr>
              <td><strong>${escapeHtml(item.lineup)}</strong></td>
              <td><span class="badge">${item.count} items</span></td>
              <td>
                <div class="edit-actions">
                  <button class="btn" onclick="enableLineupEdit(${idx})">✏️ Edit</button>
                </div>
              </td>
            </tr>
          `;
        }
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // SPRAVA EDITACE TOUR
    function enableTourEdit(idx) {
      editingTourIdx = idx;
      renderToursTable();
    }

    function cancelTourEdit() {
      editingTourIdx = -1;
      renderToursTable();
    }

    async function saveTourEdit(idx) {
      const oldItem = toursGrouped[idx];
      const newName = document.getElementById(`edit_tour_name_${idx}`).value.trim();
      const newTourId = document.getElementById(`edit_tour_id_${idx}`).value.trim();

      if (!newName) {
        alert("Tour name cannot be empty!");
        return;
      }

      if (!confirm(`Are you sure you want to update all ${oldItem.count} records with Tour "${oldItem.name}" to "${newName}"?`)) return;

      try {
        const { error } = await supabaseClient
          .from('tickets')
          .update({ 
            TOUR_NAME: newName, 
            TOUR_ID: newTourId || null 
          })
          .eq('TOUR_NAME', oldItem.name);

        if (error) throw error;
        
        editingTourIdx = -1;
        await loadDatabaseData();
      } catch (err) {
        alert('❌ Error updating tour: ' + err.message);
      }
    }

    // SPRAVA EDITACE LINEUP
    function enableLineupEdit(idx) {
      editingLineupIdx = idx;
      renderLineupsTable();
    }

    function cancelLineupEdit() {
      editingLineupIdx = -1;
      renderLineupsTable();
    }

    async function saveLineupEdit(idx) {
      const oldItem = lineupsGrouped[idx];
      const newLineup = document.getElementById(`edit_lineup_${idx}`).value.trim();

      if (!newLineup) {
        alert("Lineup cannot be empty!");
        return;
      }

      if (newLineup === oldItem.lineup) {
        cancelLineupEdit();
        return;
      }

      if (!confirm(`Are you sure you want to update this lineup across ALL ${oldItem.count} records in database?`)) return;

      try {
        const { error } = await supabaseClient
          .from('tickets')
          .update({ LINEUP: newLineup })
          .eq('LINEUP', oldItem.lineup);

        if (error) throw error;

        editingLineupIdx = -1;
        await loadDatabaseData();
      } catch (err) {
        alert('❌ Error updating lineup: ' + err.message);
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const currentParams = window.location.search;
      if (currentParams) {
        document.getElementById('backToEditorBtn').href = `edit_ticket_new.html${currentParams}`;
        document.getElementById('backToCatBtn').href = `admin_categories.html${currentParams}`;
        document.getElementById('backToMuseumBtn').href = `index.html${currentParams}`;
      }

      const isAuthenticated = await checkAuthSession();
      if (isAuthenticated) {
        await loadDatabaseData();
      }
    });
  </script>
</body>
</html>
