<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category & Subcategory Admin - JJ Museum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-panel: #141414;
      --accent-yellow: #f59e0b;
      --text-main: #e0e0e0;
      --border-color: #2a2a2a;
    }
    body { font-family: sans-serif; background: var(--bg-main); color: var(--text-main); padding: 20px; max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; color: #fff; }
    .btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
    .btn:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }
    .btn-green { background: #16a34a; border: none; font-weight: bold; }
    .btn-green:hover { background: #15803d; color: #fff; }
    .btn-danger { background: #ef4444; border: none; font-weight: bold; }
    .btn-danger:hover { background: #dc2626; color: #fff; }
    .card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    input { background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
    .subcat-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .subcat-chip { background: #222; border: 1px solid #333; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
    .subcat-chip span { cursor: pointer; color: #f87171; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Categories & Subcategories Manager</h1>
    <a href="edit_ticket_new.html" class="btn">◄ Back to Editor</a>
  </header>

  <div class="card">
    <h3 style="color: var(--accent-yellow); margin-bottom: 10px;">➕ Add New Category</h3>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="newCategoryInput" placeholder="Category Name (e.g. Programs)">
      <button class="btn btn-green" onclick="addCategory()" style="white-space: nowrap;">Add Category</button>
    </div>
  </div>

  <div id="categoriesList">⏳ Loading categories...</div>

  <script>
    let categoriesData = [];

    async function loadCategories() {
      const container = document.getElementById('categoriesList');
      try {
        const { data, error } = await supabaseClient.from('categories').select('*').order('name');
        if (error) throw error;
        categoriesData = data || [];
        renderCategories();
      } catch (err) {
        container.innerHTML = `<div style="color:#ef4444;">Error loading categories: ${err.message}</div>`;
      }
    }

    function renderCategories() {
      const container = document.getElementById('categoriesList');
      if (categoriesData.length === 0) {
        container.innerHTML = '<div>No categories found.</div>';
        return;
      }

      container.innerHTML = categoriesData.map(cat => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <strong style="font-size: 1.1rem; color: #fff;">${cat.name}</strong>
            <div>
              <button class="btn" onclick="renameCategory('${cat.id}', '${cat.name}')">✏️ Rename</button>
              <button class="btn btn-danger" onclick="deleteCategory('${cat.id}', '${cat.name}')">🗑️ Delete</button>
            </div>
          </div>

          <label style="font-size: 0.75rem; color: #888;">SUBCATEGORIES:</label>
          <div class="subcat-list">
            ${(cat.subcategories || []).map(sub => `
              <div class="subcat-chip">
                ${sub}
                <span onclick="removeSubcategory('${cat.id}', '${sub}')" title="Remove subcategory">×</span>
              </div>
            `).join('')}
          </div>

          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <input type="text" id="sub_input_${cat.id}" placeholder="New subcategory name..." style="margin-bottom: 0;">
            <button class="btn" onclick="addSubcategory('${cat.id}')" style="white-space: nowrap;">+ Add Subcategory</button>
          </div>
        </div>
      `).join('');
    }

    async function addCategory() {
      const input = document.getElementById('newCategoryInput');
      const name = input.value.trim();
      if (!name) return;

      const { error } = await supabaseClient.from('categories').insert([{ name, subcategories: [] }]);
      if (error) alert('Error: ' + error.message);
      else { input.value = ''; loadCategories(); }
    }

    async function renameCategory(id, currentName) {
      const newName = prompt('New name for category:', currentName);
      if (!newName || newName.trim() === '' || newName === currentName) return;

      const { error } = await supabaseClient.from('categories').update({ name: newName.trim() }).eq('id', id);
      if (error) alert('Error: ' + error.message);
      else loadCategories();
    }

    async function deleteCategory(id, name) {
      if (!confirm(`Are you sure you want to delete category "${name}"?`)) return;

      const { error } = await supabaseClient.from('categories').delete().eq('id', id);
      if (error) alert('Error: ' + error.message);
      else loadCategories();
    }

    async function addSubcategory(catId) {
      const input = document.getElementById(`sub_input_${catId}`);
      const val = input.value.trim();
      if (!val) return;

      const cat = categoriesData.find(c => c.id === catId);
      if (!cat) return;

      const updatedSubs = [...(cat.subcategories || []), val];
      const { error } = await supabaseClient.from('categories').update({ subcategories: updatedSubs }).eq('id', catId);
      if (error) alert('Error: ' + error.message);
      else { input.value = ''; loadCategories(); }
    }

    async function removeSubcategory(catId, subName) {
      const cat = categoriesData.find(c => c.id === catId);
      if (!cat) return;

      const updatedSubs = (cat.subcategories || []).filter(s => s !== subName);
      const { error } = await supabaseClient.from('categories').update({ subcategories: updatedSubs }).eq('id', catId);
      if (error) alert('Error: ' + error.message);
      else loadCategories();
    }

    window.addEventListener('DOMContentLoaded', loadCategories);
  </script>
</body>
</html>
