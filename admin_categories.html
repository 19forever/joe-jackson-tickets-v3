<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category & Subcategory Admin - JJ Museum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="storage-service.js"></script>
  <script src="auth.js"></script>
  <style>
    :root {
      --bg-main: #0f0f0f;
      --bg-panel: #141414;
      --accent-yellow: #f59e0b;
      --text-main: #e0e0e0;
      --border-color: #2a2a2a;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg-main); color: var(--text-main); padding: 20px; max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { background-color: var(--accent-yellow); color: #000; width: 40px; height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem; }
    h1 { font-size: 1.3rem; color: #fff; margin: 0; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .btn:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }
    .btn-green { background: #16a34a; border: none; font-weight: bold; }
    .btn-green:hover { background: #15803d; color: #fff; }
    .btn-danger { background: #ef4444; border: none; font-weight: bold; }
    .btn-danger:hover { background: #dc2626; color: #fff; }
    .card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    input { background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 0.85rem; outline: none; }
    input:focus { border-color: var(--accent-yellow); }
    .subcat-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .subcat-chip { background: #222; border: 1px solid #333; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
    .subcat-chip span { cursor: pointer; color: #f87171; font-weight: bold; margin-left: 4px; }
    .subcat-chip span:hover { color: #ef4444; }
  </style>
</head>
<body>

  <!-- AUTH GATE MODAL -->
  <div id="gateModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; padding: 30px; width: 100%; max-width: 380px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
      <div style="text-align: center; font-size: 2rem; margin-bottom: 10px;">🔒</div>
      <h2 style="text-align: center; color: #fff; margin-bottom: 6px; font-size: 1.25rem;">Admin Sign In</h2>
      <p style="text-align: center; color: #9ca3af; font-size: 0.8rem; margin-bottom: 20px;">Enter your Supabase credentials to access Categories Manager.</p>

      <form onsubmit="event.preventDefault(); handleSupabaseLogin();">
        <div style="margin-bottom: 12px;">
          <label style="display: block; font-size: 0.75rem; color: #9ca3af; margin-bottom: 4px; font-weight: 600;">EMAIL</label>
          <input type="email" id="loginEmail" placeholder="name@example.com" style="width: 100%; background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem;" required>
        </div>

        <div style="margin-bottom: 18px;">
          <label style="display: block; font-size: 0.75rem; color: #9ca3af; margin-bottom: 4px; font-weight: 600;">PASSWORD</label>
          <input type="password" id="loginPassword" placeholder="••••••••" style="width: 100%; background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem;" required>
        </div>

        <div id="loginError" style="display: none; color: #f87171; font-size: 0.75rem; margin-bottom: 12px; text-align: center;"></div>

        <button type="submit" style="width: 100%; background: #16a34a; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem;">
          🔓 Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 15px;">
        <a href="index.html" style="color: #f59e0b; text-decoration: none; font-size: 0.8rem; font-weight: 600;">◄ Back to Museum</a>
      </div>
    </div>
  </div>

  <header>
    <div class="header-left">
      <div class="logo">JJ</div>
      <h1>🏷️ Categories & Subcategories Manager</h1>
    </div>
    <div class="header-actions">
      <a href="edit_ticket_new.html" id="backToEditorBtn" class="btn">◄ Back to Editor</a>
      <button class="btn btn-danger" onclick="lockAdminSession()" title="Lock Admin Session">🔒 Lock Admin</button>
      <a href="index.html" id="backToMuseumBtn" class="btn" style="border-color: var(--accent-yellow); color: var(--accent-yellow);">Museum 🏠</a>
    </div>
  </header>

  <div class="card">
    <h3 style="color: var(--accent-yellow); margin-bottom: 10px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em;">➕ Add New Category</h3>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="newCategoryInput" placeholder="Category Name (e.g. Programs)" style="margin-bottom: 0;">
      <button class="btn btn-green" onclick="addCategory()" style="white-space: nowrap;">Add Category</button>
    </div>
  </div>

  <div id="categoriesList">⏳ Loading categories...</div>

  <script>
    let categoriesData = [];

    // KONTROLA AUTH RELACE VIA SUPABASE
    async function checkAuthSession() {
      const modal = document.getElementById('gateModal');
      if (typeof supabaseClient === 'undefined' || !supabaseClient.auth) {
        if (modal) modal.style.display = 'flex';
        return false;
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        if (modal) modal.style.display = 'none';
        localStorage.setItem('jj_admin_mode', 'true');
        return true;
      } else {
        if (modal) modal.style.display = 'flex';
        localStorage.removeItem('jj_admin_mode');
        return false;
      }
    }

    async function handleSupabaseLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errEl = document.getElementById('loginError');

      if (errEl) errEl.style.display = 'none';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        if (errEl) {
          errEl.textContent = '❌ Invalid credentials: ' + error.message;
          errEl.style.display = 'block';
        }
      } else {
        localStorage.setItem('jj_admin_mode', 'true');
        await checkAuthSession();
        await loadCategories();
      }
    }

    async function lockAdminSession() {
      if (typeof supabaseClient !== 'undefined' && supabaseClient.auth) {
        await supabaseClient.auth.signOut();
      }
      localStorage.removeItem('jj_admin_mode');
      window.location.href = 'index.html';
    }

    // NAČTENÍ KATEGORIÍ Z DB
    async function loadCategories() {
      const container = document.getElementById('categoriesList');
      try {
        const { data, error } = await supabaseClient.from('categories').select('*').order('name');
        if (error) throw error;
        categoriesData = data || [];
        renderCategories();
      } catch (err) {
        container.innerHTML = `<div style="color:#ef4444; padding: 12px; background: rgba(239, 68, 68, 0.1); border-radius: 6px;">❌ Error loading categories: ${err.message}</div>`;
      }
    }

    function renderCategories() {
      const container = document.getElementById('categoriesList');
      if (categoriesData.length === 0) {
        container.innerHTML = '<div class="card" style="color: #888;">No categories found in database.</div>';
        return;
      }

      container.innerHTML = categoriesData.map(cat => {
        const subList = Array.isArray(cat.subcategories) ? cat.subcategories : [];
        
        return `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
              <strong style="font-size: 1.1rem; color: #fff;">${escapeHtml(cat.name)}</strong>
              <div style="display: flex; gap: 6px;">
                <button class="btn" onclick="renameCategory('${cat.id}', '${escapeJsStr(cat.name)}')">✏️ Rename</button>
                <button class="btn btn-danger" onclick="deleteCategory('${cat.id}', '${escapeJsStr(cat.name)}')">🗑️ Delete</button>
              </div>
            </div>

            <label style="font-size: 0.75rem; color: #888; font-weight: 600; text-transform: uppercase;">SUBCATEGORIES:</label>
            <div class="subcat-list">
              ${subList.length > 0 ? subList.map(sub => {
                const subVal = typeof sub === 'object' ? (sub.value || sub.name) : sub;
                return `
                  <div class="subcat-chip">
                    ${escapeHtml(subVal)}
                    <span onclick="removeSubcategory('${cat.id}', '${escapeJsStr(subVal)}')" title="Remove subcategory">×</span>
                  </div>
                `;
              }).join('') : '<span style="font-size: 0.8rem; color: #555; font-style: italic;">No subcategories</span>'}
            </div>

            <div style="display: flex; gap: 8px; margin-top: 14px;">
              <input type="text" id="sub_input_${cat.id}" placeholder="New subcategory name..." style="margin-bottom: 0;" onkeydown="if(event.key==='Enter') addSubcategory('${cat.id}')">
              <button class="btn" onclick="addSubcategory('${cat.id}')" style="white-space: nowrap;">+ Add Subcategory</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function addCategory() {
      const input = document.getElementById('newCategoryInput');
      const name = input.value.trim();
      if (!name) return;

      const { error } = await supabaseClient.from('categories').insert([{ name, subcategories: [] }]);
      if (error) alert('Error adding category: ' + error.message);
      else { input.value = ''; loadCategories(); }
    }

    async function renameCategory(id, currentName) {
      const newName = prompt('New name for category:', currentName);
      if (!newName || newName.trim() === '' || newName === currentName) return;

      const { error } = await supabaseClient.from('categories').update({ name: newName.trim() }).eq('id', id);
      if (error) alert('Error renaming category: ' + error.message);
      else loadCategories();
    }

    async function deleteCategory(id, name) {
      if (!confirm(`Are you sure you want to delete category "${name}"?`)) return;

      const { error } = await supabaseClient.from('categories').delete().eq('id', id);
      if (error) alert('Error deleting category: ' + error.message);
      else loadCategories();
    }

    async function addSubcategory(catId) {
      const input = document.getElementById(`sub_input_${catId}`);
      const val = input.value.trim();
      if (!val) return;

      const cat = categoriesData.find(c => String(c.id) === String(catId));
      if (!cat) return;

      const currentSubs = Array.isArray(cat.subcategories) ? cat.subcategories.map(s => typeof s === 'object' ? s.value : s) : [];
      if (currentSubs.includes(val)) {
        alert('Subcategory already exists!');
        return;
      }

      const updatedSubs = [...currentSubs, val];
      const { error } = await supabaseClient.from('categories').update({ subcategories: updatedSubs }).eq('id', catId);
      if (error) alert('Error adding subcategory: ' + error.message);
      else { input.value = ''; loadCategories(); }
    }

    async function removeSubcategory(catId, subName) {
      const cat = categoriesData.find(c => String(c.id) === String(catId));
      if (!cat) return;

      const currentSubs = Array.isArray(cat.subcategories) ? cat.subcategories.map(s => typeof s === 'object' ? s.value : s) : [];
      const updatedSubs = currentSubs.filter(s => String(s) !== String(subName));

      const { error } = await supabaseClient.from('categories').update({ subcategories: updatedSubs }).eq('id', catId);
      if (error) alert('Error removing subcategory: ' + error.message);
      else loadCategories();
    }

    // UTILS
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeJsStr(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    // INICIALIZACE STRÁNKY
    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Zachování URL parametrů pro návrat do editoru
      const currentParams = window.location.search;
      if (currentParams) {
        const backEditorBtn = document.getElementById('backToEditorBtn');
        const backMuseumBtn = document.getElementById('backToMuseumBtn');
        if (backEditorBtn) backEditorBtn.href = `edit_ticket_new.html${currentParams}`;
        if (backMuseumBtn) backMuseumBtn.href = `index.html${currentParams}`;
      }

      // 2. Kontrola přihlášení a načtení dat
      const isAuthenticated = await checkAuthSession();
      if (isAuthenticated) {
        await loadCategories();
      }
    });
  </script>
</body>
</html>
